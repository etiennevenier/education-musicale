name: Vérification mensuelle des vidéos

# Une fois par mois, vérifie que chaque vidéo YouTube du site existe encore et
# peut être lue sur le site. En cas de problème, un ticket (« issue ») est ouvert
# sur GitHub : vous recevez un e-mail avec la liste des vidéos à remplacer.
on:
  schedule:
    - cron: '17 6 1 * *' # le 1er de chaque mois, vers 7 h (heure de Paris)
  workflow_dispatch: # bouton « Run workflow » pour la lancer à la main

permissions:
  contents: read
  issues: write

jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Le script n'utilise que Node : pas besoin d'installer les dépendances.
      - name: Vérifier les vidéos YouTube
        continue-on-error: true
        run: node scripts/check-videos.mjs --online --report rapport-videos.md

      - name: Ouvrir ou mettre à jour le ticket si une vidéo pose problème
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(cat rapport-videos.md.count 2>/dev/null || echo 0)
          unknown=$(cat rapport-videos.md.unknown 2>/dev/null || echo 0)
          total=$(cat rapport-videos.md.total 2>/dev/null || echo 0)
          ok=$((total - count - unknown))
          summary="$ok vidéo(s) sur $total fonctionnent, $count en défaut, $unknown non vérifiable(s)."
          echo "::notice title=Vidéos YouTube::$summary"
          { echo "### Vérification des vidéos"; echo; echo "$summary"; echo; cat rapport-videos.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"

          # Ticket si une vidéo pose problème, ou si YouTube n'a pas pu être
          # interrogé pour plus de la moitié des vidéos (vérification inutilisable).
          if [ "$total" -gt 0 ] && [ "$count" = "0" ] && [ $((unknown * 2)) -le "$total" ]; then exit 0; fi
          if [ "$count" = "0" ]; then
            title="Vérification des vidéos impossible"
            echo "YouTube n'a pas répondu pour $unknown vidéo(s) sur $total : la vérification automatique n'a pas pu se faire ce mois-ci." > corps.md
          else
            title="Vidéos YouTube à remplacer"
            cp rapport-videos.md corps.md
          fi
          existing=$(gh api "repos/${{ github.repository }}/issues?state=open&per_page=100" --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file corps.md
          else
            gh issue create --title "$title" --body-file corps.md
          fi
