name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npx astro check

      - name: Vitest
        run: npm test

      - name: Garde-fou !important
        run: npm run check:important

      - name: Build site
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright (e2e)
        run: npx playwright test --grep-invert "color-contrast|heading-order"

      - name: Axe (color-contrast)
        run: npx playwright test tests/e2e/contrast.spec.ts tests/e2e/contrast-interaction.spec.ts

      # Même site, construit pour Cloudflare (https://musique.etiennevenier.com, à la racine).
      - name: Construction Cloudflare (contrôle)
        run: node scripts/build-cloudflare.mjs --build-only --out dist-cloudflare

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            lh/
            test-results/
          if-no-files-found: ignore
